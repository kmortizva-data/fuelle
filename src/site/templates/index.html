<!doctype html>
<html lang="{{LANG}}" class="no-js" data-assets="../assets">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
{{ALTERNATE}}
<style>
{{STYLE}}
:root { --accent: {{ACCENT_LIGHT}}; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --accent: {{ACCENT_DARK}}; }
}
:root[data-theme="dark"] { --accent: {{ACCENT_DARK}}; }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    {{TOPLINK}}
    <div class="eyebrow"><b>{{COURSE_NAME}}</b> {{EYEBROW}}</div>
    <h1>{{COURSE_TITLE}}</h1>
    <p class="standfirst">{{SUBTITLE}}</p>
    <div class="assay">{{ASSAY}}</div>
  </div>
</header>
<main class="container">
<!-- El grafo del lago. No es decoracion: es el mapa de lo que el curso
     construye, y cada tramo dice que modulos lo levantan. -->
{{GRAPH}}
{{CONTENT}}
</main>
<section class="toc">
  <h2 class="block-title">{{UI_TOC_TITLE}}</h2>
  {{TOC}}
</section>
<footer class="footer">
  <div class="footer-inner">
    <span>{{COURSE_NAME}}</span>
    <span>{{UI_GENERATED}} {{GENERATED}}</span>
    <span>{{UI_SOURCE}}: {{SOURCE_NOTE}}</span>
  </div>
</footer>
</body>
</html>
