<!doctype html>
<html lang="{{LANG}}" class="no-js" data-assets="../assets">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{ALTERNATE}}
<style>
{{STYLE}}
/* El acento del módulo 30, el del panel, uno por tema. */
:root { --accent: {{ACCENT_LIGHT}}; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --accent: {{ACCENT_DARK}}; }
}
:root[data-theme="dark"] { --accent: {{ACCENT_DARK}}; }
</style>
</head>
<body>
<div class="shell">

  <!-- La misma barra que las lecciones: quien llega aquí desde el portafolio ve
       dónde queda el panel, al final del lago, y la cifra del veredicto. -->
  <aside class="panel">
    <a class="panel-brand" href="index{{LANG_SUFFIX}}.html">{{COURSE_NAME}}
      <small>{{EYEBROW}}</small></a>

    <nav class="rail" aria-label="{{UI_RAIL}}">
      <p class="panel-label">{{UI_RAIL}}</p>
      {{RAIL}}
    </nav>

    <div class="panel-figure">
      <span class="v">{{CIFRA_VALUE}}</span>
      <span class="l">{{CIFRA_LABEL}}</span>
    </div>

    <div class="panel-progress">
      {{PROGRESS_TEXT}}
      <span class="panel-bar"><i style="width: 100%"></i></span>
    </div>

    <nav class="panel-nav">{{NAV}}</nav>
  </aside>

  <main class="stage">
    <div class="stage-inner">
      <header class="head">
        <p class="head-id"><b>{{PANEL_ID}}</b> <span>{{PANEL_ID_TEXT}}</span></p>
        <h1>{{TITLE}}</h1>
        <p class="standfirst">{{SUBTITLE}}</p>
      </header>

      {{WIDGET}}

      {{CONTENT}}

      <footer class="footer">
        <span>{{COURSE_NAME}} / {{EYEBROW}}</span>
        <span>{{UI_GENERATED}} {{GENERATED}}</span>
        <span>{{UI_SOURCE}}: {{SOURCE_NOTE}}</span>
      </footer>
    </div>
  </main>

</div>
<!-- Sin motor ni librerías: el script suma minutos y cambia de frase. -->
<script src="panel.js" defer></script>
</body>
</html>
